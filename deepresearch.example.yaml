# Explicit synthetic demo. Never silently used when the real adapter fails.
runner: demo
# Real execution uses DeerFlow's native SubagentExecutor (runner: deerflow).
output_retries: 2
extraction_model: null
native_tools: null  # Inherit host candidates; Agent/Skill authorization still applies.
trace_capture_content: true
trace_max_chars: 16000
data_dir: .deerflow/deepresearch
skills:
  deepresearch:
    agent: research-planner
    path: examples/deepresearch/skills/deepresearch/SKILL.md
    description: 研究问题拆解与计划规范化
  industry-trend:
    agent: industry-researcher
    path: examples/deepresearch/skills/industry-trend/SKILL.md
    description: 行业现状、驱动因素与发展趋势
  technical-route:
    agent: technical-researcher
    path: examples/deepresearch/skills/technical-route/SKILL.md
    description: 技术路线、工程约束与取舍
  report-synthesis:
    agent: research-synthesizer
    path: examples/deepresearch/skills/report-synthesis/SKILL.md
    description: 基于证据池综合结构化报告
sources:
  - name: internal-kb
    origin: internal
    server: your-internal-mcp
    tool: your-internal-mcp_search
    # data: the tool returns citable records. Use search for discovery-only tools
    # and read for tools that open a document.
    role: data
    level: L1
    publisher: your-organization
    priority: 10
  - name: external-web
    origin: external
    server: your-external-mcp
    tool: your-external-mcp_search
    role: data
    level: L4
    publisher: external-search-unclassified
    priority: 20
source_fallback: [internal-kb, external-web]
max_concurrency: 3
max_active_runs: 8
tool_timeout_seconds: 45
tool_retries: 1
max_output_tokens: 4096
require_dual_source: true
# Write a report with explicit caveats when bounded supplementation cannot close
# every gap. Evidence-free runs still fail. Set false to require owner consent.
allow_limited_report: true
# Search result snippets and merely discovered links are not citable by default.
cite_search_results: false
max_synthesis_repairs: 1
max_report_sections: 8
# Site icons for cited domains are fetched by the Gateway (public hosts only,
# raster images only, cached) so browsers never contact cited sites. Set false
# without outbound access; the UI then shows letter badges.
favicons: true
# Estimated research cost (metrics tab, /metrics API and `python -m deepresearch.metrics`).
# Enter official list prices per million tokens for each model name the research
# roles use; nothing is assumed and prices are excluded from the config fingerprint.
# pricing:
#   your-model-name:
#     input_per_million: 0.0
#     cached_input_per_million: 0.0   # optional prompt-cache hit price
#     output_per_million: 0.0
#     currency: USD
budget_ceiling:
  max_iterations: 2
  max_units: 12
  max_tool_calls: 60
  max_elapsed_seconds: 900
  max_model_tokens: 120000
# Local testing only: values are ENV VARIABLE NAMES, never credentials.
local_secret_env: {}
# Production: an authenticated gateway can map dedicated headers into context.
# Do NOT map the host's own Cookie header to an unrelated MCP service.
request_secret_headers: {}
