# DeepResearch configuration. It is independent of DeerFlow's config.yaml:
# DeerFlow only registers the extension there (see examples/deepresearch/host-config.fragment.yaml)
# and provides the execution engine. Models, sources, MCP servers, roles, prompts and
# limits are configured here and can be edited later on the research settings page.
#
# Copy to deepresearch.local.yaml, set runner: deerflow and fill in credentials.
# Credentials are references: $ENV_NAME (Gateway environment / .env) or secret:NAME
# (saved on the settings page). Field reference: docs/deepresearch/RESEARCH_CONFIGURATION.md

# demo: synthetic data without model calls. deerflow: real research.
runner: demo
data_dir: .deerflow/deepresearch

# Research models. Roles, request rewriting and output extraction refer to these names.
models:
  - name: deepseek-flash
    display_name: DeepSeek V4 Flash
    provider: deepseek            # openai | deepseek | vllm | anthropic | custom (with use: class path)
    model: deepseek-v4-flash
    api_key: $DEEPSEEK_API_KEY
    max_tokens: 8192
    context_window: 128000
    supports_thinking: true       # research runs with thinking off; the provider switch is sent
    # A model gateway that only speaks OpenAI Chat Completions:
    #   provider: openai, base_url: https://llm-gateway.example/v1
    #   stream_usage: null        # auto = on: token usage in streamed answers (false if the gateway rejects stream_options)
    #   max_tokens_param: null    # auto = max_tokens for a non-OpenAI base_url (older protocol); or max_completion_tokens
    #   session_param: null       # request field carrying the conversation id so the gateway can keep one
    #   session_header: null      #   conversation on one replica (prefix caches are per replica), e.g.
    #                             #   prompt_cache_key / user, x-session-affinity. null = send nothing.
    #   top_p / temperature / extra: {extra_body: {...}}
default_model: deepseek-flash     # used by every role without its own model
rewrite_model: null               # request rewriting; null uses default_model
extraction_model: null            # notes -> structured findings; null uses the role's model

# Per-node model and call parameters. The workflow is
#   rewrite -> plan -> research (parallel) -> conversion -> outline -> section (parallel) -> summary
# plus revision and follow_up after the report. Unset fields inherit. Nodes that
# return JSON (rewrite, plan, conversion, outline, follow_up) want a low temperature.
nodes: {}
#   rewrite:    {enabled: true, model: null, temperature: 0.2, max_tokens: 1500}   # enabled: false plans the user's own words
#   plan:       {temperature: 0, max_tokens: 3000}
#   research:   {temperature: 0.3, timeout_seconds: 1200}     # a researcher's own skills.<role>.model wins over this model
#   conversion: {temperature: 0, output_retries: 3, json_mode: false}   # json_mode: response_format on gateways that support it
#   outline:    {temperature: 0.1}
#   section:    {temperature: 0.5, max_tokens: 6000, thinking: true}   # thinking: on a model with supports_thinking
#   summary:    {enabled: true}                                # false: the outline's key conclusions open the report
#   fields: enabled, model, temperature, top_p, max_tokens, timeout_seconds, output_retries, thinking, json_mode, extra_body
# Research runs without reasoning unless a node asks for it: a research turn is
# mostly tool calls and a plan is a short object, so the hidden tokens mostly buy
# latency. thinking: true sends the model's own switch (needs supports_thinking).

# Research roles. deepresearch (planner) and report-synthesis (writer) are fixed;
# every other entry is a researcher the planner can assign. Methodology comes from
# path (a Skill file) or methodology (inline text, e.g. edited on the settings page).
skills:
  deepresearch:
    name: 规划
    path: examples/deepresearch/skills/deepresearch/SKILL.md
    description: 研究问题拆解与计划规范化
  industry-trend:
    name: 行业研究员
    path: examples/deepresearch/skills/industry-trend/SKILL.md
    description: 行业现状、驱动因素与发展趋势
  technical-route:
    name: 技术研究员
    path: examples/deepresearch/skills/technical-route/SKILL.md
    description: 技术路线、工程约束与取舍
  report-synthesis:
    name: 报告撰写
    path: examples/deepresearch/skills/report-synthesis/SKILL.md
    description: 基于证据池综合结构化报告

# Sources. Each source is one tool for researchers; its providers are tried in order and a
# rate-limited, out-of-quota or failing provider cools down while the next one answers.
#   search: tavily serper brave exa bocha searxng jina_search duckduckgo http mcp
#   read:   jina_reader tavily_extract firecrawl direct http mcp
#   data:   ragflow lightrag http mcp
#   enabled: false keeps a source configured but never offers it (web search
#   switched off where only MCP tools may be used).
# Without any enabled role: read source, search results and records are the
# evidence: researchers get the research_records prompt and references say
# "search excerpt; the original was not opened".
sources:
  - name: internal-kb
    tool: knowledge_search
    role: data                    # records returned by a data source can be cited
    origin: internal
    level: L1
    publisher: your-organization
    priority: 10
    providers:
      - id: ragflow
        type: ragflow
        base_url: http://127.0.0.1:9380
        api_key: $RAGFLOW_API_KEY
        options: {dataset_ids: []} # empty: every dataset the key can access
  - name: external-web
    tool: web_search
    role: search                  # results are for discovery; pages must be opened to be cited
    origin: external
    level: L4
    publisher: web-search-unclassified
    priority: 20
    providers:
      - {id: tavily, type: tavily, api_key: $TAVILY_API_KEY}
      - {id: serper, type: serper, api_key: $SERPER_API_KEY}
      - {id: duckduckgo, type: duckduckgo}
  - name: external-read
    tool: web_fetch
    role: read                    # opened pages are the citable originals
    origin: external
    level: L4
    publisher: web-content-unclassified
    priority: 30
    providers:
      - {id: jina, type: jina_reader}  # add api_key: $JINA_API_KEY for a higher rate limit
      - {id: direct, type: direct}
source_fallback: [internal-kb, external-web, external-read]
require_dual_source: true         # false when only internal or only external sources exist

# MCP servers used only by DeepResearch sources (type: mcp providers or kind: mcp sources).
mcp_servers: {}
#   internal-kb:
#     transport: http              # http | sse | stdio (stdio only here, never from the settings page)
#     url: http://10.0.0.8:9000/mcp
#     headers:                     # a whole-value reference or interpolation inside the value
#       Authorization: Bearer ${KB_TOKEN}
#       Cookie: sid=${secret:kb-cookie}; lang=zh
#     allowed_tools: [search]      # allowlist; null allows every tool a source or provider names
#     timeout_seconds: 60          # connecting and listing tools; a server that is down fails fast
#     call_timeout_seconds: 300    # one tool call's answer, also sent to the transport
# MCP sources in full: examples/deepresearch/mcp-sources.fragment.yaml

# Engine tools roles may use besides sources. read_file continues long results the engine
# moved to a file.
engine_tools: [read_file]

# Context compaction for long role executions. The engine rewrites older messages
# into notes (prompts.compaction) once the context passes the trigger, and keeps the
# most recent content verbatim. A role's system prompt and its task always survive.
compaction:
  enabled: true
  trigger_fraction: 0.6           # of the role model's declared context_window
  fallback_trigger_tokens: 48000  # used when the model declares no context window
  keep_fraction: 0.4              # share of the trigger kept verbatim, in tokens
  max_summary_input_tokens: 24000
  model: null                     # null: summarize with the role's own model

# Providers reuse a prompt only from its first token on. The engine can show a role
# the ledger of its own tool calls, but it rewrites that ledger right after the system
# prompt on every turn, which leaves a researcher loop without a reusable prefix
# (measured: 4-5% cached input against ~70% without it). Evidence never depends on it.
tool_receipt_ledger: false

max_concurrency: 3                # research steps at once
writer_concurrency: null          # report sections at once; null = max_concurrency
max_active_runs: 8
plan_countdown_seconds: 45
plan_min_units: 3                 # research steps the planner is asked for
plan_max_units: 6
max_output_tokens: 8192           # output cap of one call; nodes.<name>.max_tokens overrides it
# Searches one research step may make; opening a page it found does not count.
# The step is told its allowance; when it is used, search tools answer with a
# stop instruction, so the researcher reads what it found and writes its notes
# instead of ending the run with BUDGET_EXHAUSTED. Reads count toward
# budget_ceiling.max_tool_calls only.
max_searches_per_unit: 30
# Soft time allowance of one research step: afterwards its tools answer with a
# stop instruction and the researcher writes its notes. null: no allowance.
max_seconds_per_unit: null
# Findings one step hands to the writer (the converter is asked for the ones that matter).
max_findings_per_unit: 12
# Gaps that start another round of research. [] never supplements. Slow models:
# [coverage, unsupported].
supplement_gap_codes: [coverage, unsupported, missing-internal, missing-external, date, open-questions]
# Time kept back from budget.max_elapsed_seconds for writing the report. Research
# winds down when only this much is left; the run no longer fails at the ceiling.
# null: a quarter of the ceiling, 120-900 seconds.
report_time_reserve_seconds: null
output_retries: 2
trace_capture_content: true       # master switch: off records no content at all
trace_max_chars: 16000            # trace payloads only; the full copies live in the audit tables
llm_audit: true                   # keep the complete prompt and answer of every model call
tool_audit: true                  # keep the complete arguments and answer of every tool call
wire_audit: true                  # keep every MCP invocation and HTTP provider request behind those tools
audit_max_chars: 200000           # one recorded body; over it the record says it was cut
# Days of recorded runs to keep. null keeps everything: pruning is explicit,
# with `python -m deepresearch.logbook prune --data-dir <dir> --older-than 30d`.
audit_retention_days: null
# Write a report with explicit caveats when bounded supplementation cannot close
# every gap. Evidence-free runs still fail. Set false to require owner consent.
allow_limited_report: true
# Search result snippets and merely discovered links are not citable by default.
cite_search_results: false
max_synthesis_repairs: 1
max_report_sections: 8
# Scales the per-section and summary length targets. Measured on one question: 1.0 gave about
# 29,000 characters, 0.45 about 18,000 (ChatGPT deep research: about 5,000 plus tables). Below 1,
# a section far past its ceiling gets one shortening repair. Guidance, never a failure.
report_length_scale: 1.0
# Site icons for cited domains are fetched by the Gateway (public hosts only,
# raster images only, cached). Set false without outbound access. A source may
# name the icon of its own site (`logo_url` beside the result's `url`); it is
# fetched here, never by the browser, and only for that site's own host.
favicons: true
# Let that fetch reach a private address, for an icon an internal site declared
# for itself. Off by default: it lets a configured source name a URL the Gateway
# then fetches. Only ever on the host the source itself cites.
favicon_private_network: false
# Estimated research cost per model name (metrics only; never fetched or assumed).
# pricing:
#   deepseek-flash:
#     input_per_million: 0.0
#     cached_input_per_million: 0.0
#     output_per_million: 0.0
#     currency: CNY
budget_ceiling:
  max_iterations: 2
  max_units: 12
  max_tool_calls: 60
  max_elapsed_seconds: 900
  max_model_tokens: 120000
# Local testing only: values are ENV VARIABLE NAMES, never credentials.
local_secret_env: {}
# Production: an authenticated gateway can map dedicated headers into context.
# Do NOT map the host's own Cookie header to an unrelated MCP service.
request_secret_headers: {}
