# 离线部署：DeerFlow 引擎配置片段（config.yaml）。
#
# DeepResearch 的模型、知识库、MCP、角色和提示词都在研究配置（deepresearch.local.yaml）里，
# 这里只有引擎本身的运行参数和插件注册。
#
# 用法（详见 docs/deepresearch/DEERFLOW_CONFIGURATION.md）：
#   1. cp config.example.yaml config.yaml
#   2. 用本文件里的同名段整段替换 config.yaml 中的段：sandbox、title、suggestions、summarization、
#      memory、subagent_runtime、plugins。其他段保持 config.example.yaml 的默认值。
#   3. config.yaml 里的 models 只给 DeerFlow 自己的聊天使用，研究不会用到；离线时可以删成空列表 []。
#
# 本文件由 tests/deepresearch/test_offline_config.py 校验，改动后请运行该测试。

sandbox:
  # 本机沙箱，不需要 Docker 镜像。研究员只用它读取引擎外置到文件的长工具结果。
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 20000    # 上下文小的模型把这个值调低
  ls_output_max_chars: 10000
  bash_command_timeout: 600

title:
  enabled: true
  model_name: null                     # null：用本地规则生成标题，不调用模型

suggestions:
  enabled: false                       # 少一次模型调用

summarization:
  enabled: true
  model_name: null                     # null：用正在运行的研究模型压缩上下文
  trigger:
    - type: tokens
      value: 24000                     # 约为研究模型 context_window 的 40%；32k 上下文的模型改成 12000
  keep:
    type: messages
    value: 8
  trim_tokens_to_summarize: 12000

memory:
  enabled: false                       # 记忆会额外调用模型，离线开发先关闭

subagent_runtime:
  max_running: 2                       # 不小于研究配置里的 max_concurrency
  max_queued: 64
  admission_policy: queue
  queue_timeout_seconds: 1800

plugins:
  - name: deepresearch
    use: deepresearch.extension:install
    required: true
    config:
      config_path: deepresearch.local.yaml   # 相对仓库根目录
