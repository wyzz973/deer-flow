# MERGE into your existing config.yaml. This is the only DeerFlow-side entry DeepResearch needs:
# it registers the extension and points it at its own configuration file. Research models,
# sources, MCP servers, roles and prompts live in that file (and on the research settings page),
# not in config.yaml. First copy deepresearch.example.yaml -> deepresearch.local.yaml.
plugins:
  - name: deepresearch
    use: deepresearch.extension:install
    required: true
    config:
      config_path: deepresearch.local.yaml
