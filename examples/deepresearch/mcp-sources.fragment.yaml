# Merge into deepresearch.local.yaml; this fragment is not a complete config.
# DeepResearch talks to its own MCP servers (not extensions_config.json). A server
# can back a provider inside a failover chain, or be exposed as a source of its own
# with the tool's native schema. Credentials are references; per-request credentials
# come from request_secret_headers below.
mcp_servers:
  your-internal-mcp:
    transport: http                 # http | streamable_http | sse | stdio (stdio only in this file, never from the settings page)
    url: https://YOUR-INTERNAL-MCP/mcp
    headers:                        # a whole-value reference, or interpolation inside the value
      Cookie: sid=${secret:research_cookie}; lang=zh
      X-Csrf-Token: secret:research_csrf
      # Authorization: Bearer ${MCP_TOKEN}      # an environment variable of the Gateway
    # Allowlist: only these tools of the server can be bound by sources and providers,
    # checked when the configuration loads and again when a tool is resolved. A tool
    # the server adds later is unreachable until it is listed. null: no restriction.
    allowed_tools: [search, tickets.search]
    # Connecting and listing tools: an unreachable server should say so quickly.
    timeout_seconds: 60
    # One tool call's answer. It is also passed to the transport, whose own
    # defaults (30 s per streamable-HTTP request, 5 s to open an SSE stream) are
    # what would otherwise cut a slow internal search off.
    call_timeout_seconds: 300
    description: Internal knowledge base

sources:
  # 1) An MCP tool inside a provider chain: one stable schema for the model.
  - name: internal-knowledge
    tool: knowledge_search
    role: data                      # returned records are citable
    origin: internal
    level: L1
    publisher: your-organization
    priority: 10
    providers:
      - id: kb
        type: mcp
        server: your-internal-mcp
        tool: search                # the MCP tool's own name
        # arguments: {query: "{query}", top_k: "{max_results}"}  # inferred when omitted

  # 2) The MCP tool exposed as-is, keeping its own arguments.
  - name: internal-tickets
    kind: mcp
    tool: ticket_search             # the name the model sees
    server: your-internal-mcp
    mcp_tool: tickets.search        # omit when it equals `tool`
    role: data
    origin: internal
    level: L2

# Research with MCP tools only: leave out web sources, or keep them configured
# and switched off with `enabled: false`, and set `require_dual_source: false`.
# When no enabled source has `role: read` (nothing can open an original page),
# search results and records are the evidence: researchers get the
# `research_records` prompt instead of "open the page first", every result is
# cited on its own, and references say "search excerpt; the original was not
# opened". A provider-based source (1) gives one citation per record with its
# own title and link; a `kind: mcp` source (2) is cited as one whole output per call.
#
#   python -m deepresearch.doctor --config deepresearch.local.yaml --probe-mcp
# connects to every server, lists its tools and checks the tools research uses.

# Per-request credentials. The Gateway reads these request headers into named
# credentials; a request's value overrides the saved `secret:` of the same name for
# that request only (MCP connection headers/env and custom HTTP provider headers).
# Values never reach the model, the store or the trace, and two users never share a
# discovered-tool cache entry.
request_secret_headers:
  X-Research-Cookie: research_cookie
  X-Research-Csrf: research_csrf
