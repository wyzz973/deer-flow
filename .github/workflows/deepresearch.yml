name: DeepResearch full-stack checks
on:
  push:
    branches: ["feat/deepresearch-v1-fullstack-20260914"]
  pull_request:
    paths: ["backend/deepresearch/**", "backend/packages/harness/deerflow/subagents/**", "backend/tests/test_subagent_executor.py", "backend/pyproject.toml", "backend/uv.lock", "tests/deepresearch/**", "frontend/**deepresearch**", "frontend/src/**/deepresearch/**", "frontend/src/components/workspace/**", "examples/deepresearch/**", "deepresearch.example.yaml", ".github/workflows/deepresearch.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --directory backend --no-sync python -c "import langgraph; from langgraph.checkpoint.sqlite.aio import AsyncSqliteSaver"
      - run: uv run --directory backend --no-sync python -m pytest ../tests/deepresearch -v --junitxml=../deepresearch-test-results/backend.xml
      - run: python -m compileall -q backend/deepresearch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepresearch-backend-results
          path: deepresearch-test-results
  native-executor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync python -m pytest tests/test_subagent_executor.py -q
      - run: uv run --no-sync ruff check deepresearch packages/harness/deerflow/subagents/executor.py
      - run: uv run --no-sync ruff format --check deepresearch packages/harness/deerflow/subagents/executor.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.2 --activate
      - run: python -m pip install -r backend/deepresearch/requirements.txt
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm check
        working-directory: frontend
      - run: python scripts/pnpm.py exec rstest run tests/unit/core/deepresearch tests/unit/components/deepresearch
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test -c playwright.deepresearch.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepresearch-browser-results
          path: |
            frontend/playwright-deepresearch-report
            frontend/test-results
